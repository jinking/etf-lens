[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "etf-research-engine"
version = "0.1.0"
description = "A-share ETF data and research engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "akshare>=1.16",
  "duckdb>=1.2",
  "pandas>=2.2",
  "numpy>=2.0",
  "pyarrow>=18",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "typer>=0.15",
  "httpx>=0.28",
  "tenacity>=9.0",
  "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
  "mypy>=1.14",
]

agent = [
  "mcp>=1.0",
]

[project.scripts]
etf = "etf_engine.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/etf_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: tests that call live upstream data sources",
]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
